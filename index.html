<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>木取りシミュレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f1f5f9; }
        canvas { 
            background-color: #ffffff; 
            border: 1px solid #cbd5e1; 
            border-radius: 12px; 
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            max-width: 100%;
            height: auto !important;
        }
        .control-panel { 
            background-color: #ffffff;
            border-radius: 16px 16px 0 0;
            box-shadow: 0 -4px 6px -1px rgb(0 0 0 / 0.1);
        }
        input[type="number"] { 
            width: 100%; 
            border: 1px solid #cbd5e1; 
            padding: 6px; 
            border-radius: 6px;
            font-size: 16px;
            appearance: none;
            text-align: center;
        }
        label { font-size: 0.7rem; font-weight: 700; color: #475569; display: block; }
        .result-card { 
            background: linear-gradient(135deg, #334155 0%, #0f172a 100%); 
            color: white; 
            padding: 10px 8px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .sticky-canvas {
            position: sticky;
            top: 0px;
            z-index: 10;
            background-color: #f1f5f9;
            padding-bottom: 8px;
        }
    </style>
</head>
<body class="antialiased">
    <div class="max-w-4xl mx-auto pb-10">
        <!-- ヘッダー -->
        <header class="p-3 bg-white mb-1 shadow-sm flex justify-between items-center">
            <h1 class="text-lg font-bold text-gray-800">木取りシミュレーター</h1>
            <span class="text-[10px] text-gray-400">JAS末口二乗法</span>
        </header>

        <!-- 計算結果パネル -->
        <div class="grid grid-cols-3 gap-2 px-3 mb-3">
            <div class="result-card">
                <p class="text-[9px] opacity-70">丸太材積</p>
                <p class="text-md font-bold truncate"><span id="logVolume">0</span><span class="text-[9px] ml-0.5 font-normal">m³</span></p>
            </div>
            <div class="result-card">
                <p class="text-[9px] opacity-70">製品合計</p>
                <p class="text-md font-bold truncate"><span id="productVolume">0</span><span class="text-[9px] ml-0.5 font-normal">m³</span></p>
            </div>
            <div class="result-card border-b-2 border-yellow-500">
                <p class="text-[9px] opacity-70 font-bold text-yellow-500">歩留まり</p>
                <p class="text-md font-bold text-yellow-400"><span id="yieldRate">0</span><span class="text-[9px] ml-0.5 text-white font-normal">%</span></p>
            </div>
        </div>

        <!-- メインコンテンツ -->
        <div class="flex flex-col gap-2 px-3">
            <!-- プレビューエリア -->
            <div class="w-full flex justify-center sticky-canvas">
                <canvas id="canvas" width="600" height="600" class="w-full max-w-[400px]"></canvas>
            </div>

            <!-- 設定フォーム -->
            <div class="control-panel p-4 space-y-5 pb-10">
                
                <!-- 基本設定 -->
                <section>
                    <h2 class="text-sm font-bold border-l-4 border-blue-500 pl-2 mb-3 text-slate-700">基本設定</h2>
                    <div class="grid grid-cols-2 gap-2 text-center">
                        <div>
                            <label>材長(mm)</label>
                            <input type="number" id="logLength" value="4000">
                        </div>
                        <div>
                            <label>末口(cm)</label>
                            <input type="number" id="logDiameter" value="30" step="0.1">
                        </div>
                        <div>
                            <label>倍率</label>
                            <input type="number" id="zoomScale" value="15">
                        </div>
                        <div>
                            <label class="text-red-500">のこ身(mm)</label>
                            <input type="number" id="kerfWidth" value="2" step="0.1">
                        </div>
                    </div>
                </section>

                <!-- 角材設定 -->
                <section>
                    <h2 class="text-sm font-bold border-l-4 border-green-500 pl-2 mb-3 text-slate-700">中心角材</h2>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label>高さ(mm)</label>
                            <input type="number" id="coreHeight" value="120">
                        </div>
                        <div>
                            <label>幅(mm)</label>
                            <input type="number" id="coreWidth" value="120">
                        </div>
                    </div>
                </section>

                <!-- 板の配置 -->
                <section>
                    <h2 class="text-sm font-bold border-l-4 border-orange-500 pl-2 mb-2 text-slate-700">板の配置</h2>
                    
                    <!-- 表形式のヘッダー -->
                    <div class="flex items-center gap-2 px-2 mb-1 text-center">
                        <div class="w-10"></div>
                        <div class="flex-1 text-[10px] font-bold text-slate-400">厚(mm)</div>
                        <div class="flex-1 text-[10px] font-bold text-slate-400">幅(mm)</div>
                        <div class="w-12 text-[10px] font-bold text-slate-400">枚</div>
                    </div>

                    <div id="plankControls" class="space-y-1">
                        <!-- JSで生成 -->
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const PLANK_COUNT = 8;
        const colors = {
            log: '#3b82f6',
            core: '#10b981',
            plank: '#f97316',
            text: '#6b7280'
        };

        const plankContainer = document.getElementById('plankControls');
        for (let i = 1; i <= PLANK_COUNT; i++) {
            const div = document.createElement('div');
            div.className = "bg-white p-1 flex items-center gap-2 border-b border-slate-100";
            
            // ラベルの設定 (1~4: 上, 5~8: 左)
            const sideIndex = i <= 4 ? i : i - 4;
            const label = i <= 4 ? `上${sideIndex}` : `左${sideIndex}`;
            
            // 厚みの初期値を設定
            let initialThick = 51;
            if (sideIndex === 3) initialThick = 37;
            if (sideIndex === 4) initialThick = 19;

            // 枚数の初期値を設定 (1~3は2枚, 4は0枚)
            const initialCount = (sideIndex === 4) ? 0 : 2;

            div.innerHTML = `
                <div class="w-10 font-bold text-[10px] text-slate-500">${label}</div>
                <div class="flex-1"><input type="number" id="p${i}t" value="${initialThick}"></div>
                <div class="flex-1"><input type="number" id="p${i}w" value="120"></div>
                <div class="w-12"><input type="number" id="p${i}c" value="${initialCount}" min="0" max="2"></div>
            `;
            plankContainer.appendChild(div);
        }

        function draw() {
            const logLengthMm = parseFloat(document.getElementById('logLength').value) || 0;
            const logDiamCm = parseFloat(document.getElementById('logDiameter').value) || 0;
            const zoom = parseFloat(document.getElementById('zoomScale').value) || 10;
            const kerfMm = parseFloat(document.getElementById('kerfWidth').value) || 0;
            const coreHMm = parseFloat(document.getElementById('coreHeight').value) || 0;
            const coreWMm = parseFloat(document.getElementById('coreWidth').value) || 0;

            const kerf = (kerfMm / 10) * zoom;
            const coreH = (coreHMm / 10) * zoom;
            const coreW = (coreWMm / 10) * zoom;
            const logDiam = logDiamCm * zoom;
            const logLengthM = logLengthMm / 1000;

            let logVolumeM3 = 0;
            if (logLengthM > 0 && logDiamCm > 0) {
                let rawVol = 0;
                if (logLengthM < 6) {
                    rawVol = (logDiamCm * logDiamCm * logLengthM) / 10000;
                } else {
                    const factor = logDiamCm + (logLengthM - 4) / 2;
                    rawVol = (factor * factor * logLengthM) / 10000;
                }
                logVolumeM3 = Math.round(rawVol * 1000) / 1000;
            }

            let totalProductVolumeM3 = (coreHMm / 1000) * (coreWMm / 1000) * logLengthM;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            ctx.beginPath();
            ctx.arc(cx, cy, logDiam / 2, 0, Math.PI * 2);
            ctx.strokeStyle = colors.log;
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.strokeStyle = colors.core;
            ctx.strokeRect(cx - coreW / 2, cy - coreH / 2, coreW, coreH);

            let offsetUe = cy - coreH / 2 - kerf;
            let offsetSita = cy + coreH / 2 + kerf;
            let offsetHidari = cx - coreW / 2 - kerf;
            let offsetMigi = cx + coreW / 2 + kerf;

            ctx.strokeStyle = colors.plank;

            for (let i = 1; i <= PLANK_COUNT; i++) {
                const tMm = parseFloat(document.getElementById(`p${i}t`).value) || 0;
                const wMm = parseFloat(document.getElementById(`p${i}w`).value) || 0;
                const count = parseInt(document.getElementById(`p${i}c`).value) || 0;
                const t = (tMm / 10) * zoom;
                const w = (wMm / 10) * zoom;
                if (t <= 0 || w <= 0 || count <= 0) continue;

                totalProductVolumeM3 += (tMm / 1000) * (wMm / 1000) * logLengthM * count;

                if (i <= 4) {
                    ctx.strokeRect(cx - w / 2, offsetUe - t, w, t);
                    offsetUe -= (t + kerf);
                    if (count >= 2) {
                        ctx.strokeRect(cx - w / 2, offsetSita, w, t);
                        offsetSita += (t + kerf);
                    }
                } else {
                    ctx.strokeRect(offsetMigi, cy - w / 2, t, w);
                    offsetMigi += (t + kerf);
                    if (count >= 2) {
                        ctx.strokeRect(offsetHidari - t, cy - w / 2, t, w);
                        offsetHidari -= (t + kerf);
                    }
                }
            }

            totalProductVolumeM3 = Math.round(totalProductVolumeM3 * 10000) / 10000;
            const yieldRate = logVolumeM3 > 0 ? (totalProductVolumeM3 / logVolumeM3) * 100 : 0;

            document.getElementById('logVolume').innerText = logVolumeM3.toFixed(3);
            document.getElementById('productVolume').innerText = totalProductVolumeM3.toFixed(4);
            document.getElementById('yieldRate').innerText = yieldRate.toFixed(1);

            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = '#cbd5e1';
            ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy); ctx.stroke();
            ctx.setLineDash([]);
        }

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', draw);
        });

        window.onload = draw;
    </script>
</body>
</html>
